services:
  radar:
    build: .
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env.worker
    environment:
      RADAR_USER: ${RADAR_USER:?configure RADAR_USER}
      RADAR_PASSWORD: ${RADAR_PASSWORD:?configure RADAR_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - radar-data:/app/data
      - ./config/operations.json:/app/config/operations.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    command: ["npm", "run", "ops:worker"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env.worker
    environment:
      RADAR_AUTO_BACKUP: "1"
      RADAR_BACKUP_KEEP_DAYS: "14"
    stop_grace_period: 90s
    volumes:
      - radar-data:/app/data
      - ./config/operations.json:/app/config/operations.json:ro
    depends_on:
      radar:
        condition: service_healthy
volumes:
  radar-data:
